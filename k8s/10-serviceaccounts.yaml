# An identity for each workload. The chat UI's identity is what Google IAM sees when it calls Vertex AI
# (Workload Identity Federation for GKE): no key file, nothing to rotate or leak. The IAM grant is
# made once, in K8S.md step 3, to this exact namespace + service account name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chat-ui
---
# The agent never talks to Google APIs (it calls Anthropic with a key from a Secret), so it gets an
# identity with no credentials mounted. If this pod is compromised, there is no cluster token to steal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plumbing-agent
automountServiceAccountToken: false
