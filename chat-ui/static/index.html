<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipe &amp; Supply Chat</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d2327; --muted: #667078; --line: #dcd9d0;
    --accent: #0b5cad; --accent-ink: #ffffff; --me: #e7f0fa; --err: #a32020;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181b; --panel: #1c2226; --ink: #e8ecee; --muted: #8e9aa2; --line: #2d363c;
            --accent: #5aa5ec; --accent-ink: #0c1216; --me: #213a52; --err: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; min-height: 100dvh;
         display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
           justify-content: space-between; }
  h1 { font-size: 1.1rem; margin: 0; }
  .pick { display: flex; gap: 8px; flex-wrap: wrap; }
  select, textarea, button { font: inherit; color: inherit; }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  #log { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding: 4px 0; }
  .msg { max-width: 88%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
         background: var(--panel); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--me); }
  .msg.err { color: var(--err); }
  .meta { display: block; margin-top: 6px; font-size: .78rem; color: var(--muted); }
  .hint { color: var(--muted); font-size: .9rem; }
  form { display: flex; gap: 8px; position: sticky; bottom: 0; padding-bottom: 4px; background: var(--bg); }
  textarea { flex: 1; resize: none; background: var(--panel); border: 1px solid var(--line);
             border-radius: 10px; padding: 10px 12px; }
  button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
           padding: 0 18px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: progress; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kansas City Pipe &amp; Supply</h1>
    <div class="pick">
      <label class="hint">Talk to
        <select id="target" aria-label="Target">
          <option value="agent">Plumbing agent (in cluster)</option>
          <option value="vertex">A Vertex AI model</option>
        </select>
      </label>
      <select id="model" aria-label="Vertex AI model" hidden></select>
    </div>
  </header>

  <div id="log" aria-live="polite">
    <p class="hint" id="intro">Try: <em>“Need 40 of the 3/4 PEX elbows. When can I get them?”</em>
      Switching target starts a fresh conversation.</p>
  </div>

  <form id="form">
    <textarea id="input" rows="2" maxlength="2000" placeholder="Type a message…" required></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send"), target = $("target"), model = $("model");
let history = [];   // the browser owns the conversation; the server is stateless

fetch("/api/config").then(r => r.json()).then(c => {
  c.models.forEach(m => model.add(new Option(m, m)));
}).catch(() => {});

target.addEventListener("change", () => {
  model.hidden = target.value !== "vertex";
  history = [];
  log.replaceChildren($("intro"));
});

function bubble(text, cls, meta) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;                       // textContent, never innerHTML: model output is untrusted
  if (meta) { const s = document.createElement("span"); s.className = "meta"; s.textContent = meta; d.append(s); }
  log.append(d); d.scrollIntoView({ block: "end" });
  return d;
}

function metaLine(r) {
  const bits = [r.model, `${r.round_trip_ms} ms`, `${r.input_tokens}+${r.output_tokens} tok`];
  if (r.served_by) bits.push(`pod ${r.served_by}`);
  if (r.order_total) bits.push(`order $${r.order_total.toFixed(2)}`);
  return bits.filter(Boolean).join(" · ");
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  history.push({ role: "user", content: text });
  bubble(text, "me"); input.value = ""; send.disabled = true;
  const wait = bubble("…", "bot");
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ target: target.value, model: model.value, messages: history }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : `Request rejected (HTTP ${res.status})`);
    history.push({ role: "assistant", content: body.reply });
    wait.textContent = body.reply;
    const s = document.createElement("span"); s.className = "meta"; s.textContent = metaLine(body); wait.append(s);
  } catch (err) {
    history.pop();                             // let the user resend the same message
    wait.className = "msg err"; wait.textContent = String(err.message || err);
  } finally {
    send.disabled = false; input.focus();
  }
});

input.addEventListener("keydown", (e) => {     // Enter sends, Shift+Enter = newline
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
</script>
</body>
</html>
